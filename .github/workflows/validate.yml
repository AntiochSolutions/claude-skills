name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-marketplace.mjs
      # the plugin tests existed before CI ran them; a broken SessionStart hook
      # shipped green until 2026-08-14
      - run: node --test tests/*.test.mjs
